services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payments
      POSTGRES_DB: payments
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  pipeline:
    build: .
    environment:
      PGHOST: postgres
      PGDATABASE: payments
      PGUSER: payments
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    # Named volume initialized from /app with appuser ownership.
    volumes:
      - reports:/app/reports
    command: [sh, -c, "python -m payment_reliability.cli generate --data-dir /app/reports/data && python -m payment_reliability.cli run --data-dir /app/reports/data --output /app/reports/output --backend postgres && dbt build --project-dir /app/dbt --profiles-dir /app/dbt"]
  dashboard:
    image: python:3.12-slim
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - reports:/reports:ro
    ports:
      - "127.0.0.1:8080:8080"
    command: [python, -m, http.server, "8080", --directory, /reports/output]
volumes:
  pgdata:
  reports:
